name: Patch long opponent names
on:
  push:
    branches: [fix/shrink-long-opponent-names]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shrink-long-opponent-names
      - name: Shrink Oklahoma State and Mississippi State
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="(team==='Western Michigan'||team==='Washington State')?' style=\"font-size:11px;\"':''"
          new="(team==='Western Michigan'||team==='Washington State'||team==='Oklahoma State'||team==='Mississippi State')?' style=\"font-size:11px;\"':''"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -q "team==='Oklahoma State'" index.html
          grep -q "team==='Mississippi State'" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add index.html
          git commit -m "Shrink long opponent names in score rows"
          git push
