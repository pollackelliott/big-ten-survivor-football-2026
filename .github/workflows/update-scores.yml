name: Update Big Ten Survivor scores

on:
  schedule:
    - cron: '*/30 17-23 * * *'
    - cron: '*/30 0-8 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to update (leave blank to auto-detect)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: big-ten-score-ingestion
  cancel-in-progress: true

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Read initialized season
        id: season
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          config = json.loads(Path("season.json").read_text(encoding="utf-8"))
          year = config.get("year")
          start = config.get("pool_start_date")
          weeks = config.get("weeks", 13)

          if not year or not start:
              raise SystemExit("season.json has not been initialized")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"year={int(year)}\n")
              fh.write(f"pool_start_date={start}\n")
              fh.write(f"weeks={int(weeks)}\n")
          PY

      - name: Determine week
        id: week
        shell: bash
        env:
          WEEK1_MONDAY: ${{ steps.season.outputs.pool_start_date }}
          MAX_WEEKS: ${{ steps.season.outputs.weeks }}
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$WEEK1_MONDAY" +%s) ) / 86400 ))

          if [ "$DAYS" -lt 0 ]; then
            echo "week=1" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "run_scraper=false" >> "$GITHUB_OUTPUT"
              echo "Pool has not begun; scheduled ingestion skipped until $WEEK1_MONDAY."
            else
              echo "run_scraper=true" >> "$GITHUB_OUTPUT"
              echo "Preseason manual run targeting pool Week 1."
            fi
            exit 0
          fi

          WEEK=$(( DAYS / 7 + 1 ))

          DOW=$(TZ=America/Chicago date +%u)
          if [ "$DOW" = "1" ] && [ "$WEEK" -gt 1 ]; then
            PREVIOUS_WEEK=$(( WEEK - 1 ))
            if [ "$PREVIOUS_WEEK" -le "$MAX_WEEKS" ]; then
              echo "previous_week=$PREVIOUS_WEEK" >> "$GITHUB_OUTPUT"
              echo "Monday backfill enabled for pool week $PREVIOUS_WEEK."
            fi
          fi

          if [ "$WEEK" -gt "$MAX_WEEKS" ]; then
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "run_scraper=false" >> "$GITHUB_OUTPUT"
            echo "Regular-season pool is complete; scheduled score ingestion skipped."
          else
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            echo "Auto-detected pool week $WEEK from Chicago date $TODAY."
          fi

      - name: Backfill previous week
        if: steps.week.outputs.previous_week != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/update_scores.py --week ${{ steps.week.outputs.previous_week }}

      - name: Run scraper
        if: steps.week.outputs.run_scraper == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/update_scores.py --week ${{ steps.week.outputs.week }}
