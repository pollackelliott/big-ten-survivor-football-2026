name: Export 2026 season archive

on:
  push:
    branches:
      - archive/export-2026-season-data
    paths:
      - scripts/export_archive_2026.py
      - .github/workflows/export-archive-2026.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/export-2026-season-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Export public season state
        run: python scripts/export_archive_2026.py

      - name: Commit archive data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/2026-season.json
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Capture final 2026 season archive data"
            git push
          fi
