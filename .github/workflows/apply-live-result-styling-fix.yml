name: Apply live result styling fix

on:
  push:
    branches:
      - ui-live-result-styling-fix
    paths:
      - .github/workflows/apply-live-result-styling-fix.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-live-result-styling-fix
      - name: Apply final-only pick styling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = "if(picked&&played)c.push(win?'pick-hit':'pick-miss');"
          new = "if(picked&&g.winner)c.push(win?'pick-hit':'pick-miss');"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one live pick-style condition, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply pick result styling only after final"
          git push origin HEAD:ui-live-result-styling-fix
