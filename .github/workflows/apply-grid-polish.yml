name: Apply grid polish

on:
  push:
    branches:
      - ui-grid-polish-long-names

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              (
                  'table.grid th.corner{position:sticky; left:0; top:0; z-index:5; background:var(--panel-2); text-align:left;',
                  'table.grid th.corner{position:sticky; left:0; top:0; z-index:5; background:var(--panel-2); text-align:center;'
              ),
              (
                  'return `<span class="game-team-name ${teamCategoryClass(team)}">${team}</span>`;',
                  'return `<span class="game-team-name ${teamCategoryClass(team)}"${(team===\'Western Michigan\'||team===\'Washington State\')?\' style="font-size:11px;"\':\'\'}>${team}</span>`;'
              ),
              (
                  'async function refreshAll(){await loadAll();CURRENT_WEEK=computeCurrentWeek();',
                  "async function refreshAll(){await loadAll();const errorEl=document.getElementById('errorMsg');errorEl.style.display='none';errorEl.textContent='';CURRENT_WEEK=computeCurrentWeek();"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -Fq 'background:var(--panel-2); text-align:center;' index.html
          grep -Fq "team==='Western Michigan'" index.html
          grep -Fq "team==='Washington State'" index.html
          grep -Fq "errorEl.style.display='none';errorEl.textContent='';" index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish grid header and long opponent names'
          git push
